name: Build UniShare (Windows + Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Build Windows .exe ────────────────────────────────────────────────────
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install kivy[base] kivymd==1.2.0 pillow requests pyinstaller
          pip install kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: Construire UniShare.exe
        run: pyinstaller build_desktop.spec --clean --noconfirm

      - name: Uploader l'EXE
        uses: actions/upload-artifact@v4
        with:
          name: UniShare-Windows
          path: dist/UniShare.exe
          retention-days: 30

  # ── Build Android APK via Docker Kivy (SDK/NDK déjà installés) ───────────
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Cache .buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-docker-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: buildozer-docker-

      - name: Construire l'APK avec Docker Kivy/Buildozer
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Vérifier et lister l'APK
        run: |
          echo "=== Contenu bin/ ==="
          ls -lh bin/ || echo "Dossier bin/ vide"
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK créé avec succès !"
            ls -lh bin/*.apk
          else
            echo "ERREUR : pas d'APK dans bin/"
            exit 1
          fi

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: UniShare-Android
          path: bin/*.apk
          retention-days: 30

  # ── Créer la Release GitHub ───────────────────────────────────────────────
  create-release:
    name: Publier la Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Télécharger EXE (si disponible)
        uses: actions/download-artifact@v4
        with:
          name: UniShare-Windows
          path: release/
        continue-on-error: true

      - name: Télécharger APK (si disponible)
        uses: actions/download-artifact@v4
        with:
          name: UniShare-Android
          path: release/
        continue-on-error: true

      - name: Lister les fichiers disponibles
        run: ls -lh release/ || echo "Dossier release vide"

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "UniShare ${{ github.ref_name }}"
          body: |
            ## UniShare – Plateforme Étudiante Marocaine

            ### Téléchargements :

            | Plateforme | Fichier | Instructions |
            |---|---|---|
            | Windows | `UniShare.exe` | Double-clic pour lancer |
            | Android | `*.apk` | Activer "Sources inconnues" puis installer |

            ### Installation Android :
            1. Télécharger le fichier `.apk`
            2. **Paramètres → Sécurité → Sources inconnues** → Activer
            3. Ouvrir le fichier APK → **Installer**

          files: release/**
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
